# Поклади цей файл у репозиторій як .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Якщо запушив новий коміт у той самий PR — старий запуск скасовується
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    # Тимчасова БД з PostGIS для тестів, що ходять у Postgres
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alerts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/alerts_test
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4   # версію pnpm бере з "packageManager" у package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck

      # Міграції на тестову БД перед тестами (назву скрипта підстав свою)
      - run: pnpm --filter @alerts-shelters/db db:migrate

      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker build (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Лише перевіряє, що образ збирається; нікуди не пушить
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
